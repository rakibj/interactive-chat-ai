[project]
name = "interactive-chat-ai"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "accelerate>=1.12.0",
    "bitsandbytes>=0.49.1",
    "dotenv>=0.9.9",
    "faster-whisper>=1.2.1",
    "gradio>=6.5.1",
    "huggingface-hub>=1.3.4",
    "numpy>=2.4.1",
    "openai>=2.16.0",
    "pocket-tts>=1.0.3",
    "pytest>=9.0.2",
    "scipy>=1.17.0",
    "sounddevice>=0.5.5",
    "torch>=2.10.0",
    "torchaudio>=2.10.0",
    "transformers>=5.0.0",
    "vosk>=0.3.45",
]

[tool.uv.workspace]
members = [
    "piper-python",
]

# Test automation configuration
[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py", "verify_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short --capture=no"
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests (require server)",
    "unit: marks tests as unit tests",
    "phase: marks tests as phase transition tests",
    "api: marks tests as API endpoint tests",
    "websocket: marks tests as WebSocket tests",
]
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::PendingDeprecationWarning",
]

# Coverage configuration
[tool.coverage.run]
branch = true
source = ["interactive_chat"]
omit = [
    "*/tests/*",
    "*/site-packages/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]
precision = 2

# Linting configuration
[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]  # Line too long (handled by formatter)
